services:
  postgres:
    image: postgres:16-alpine
    container_name: vulntracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vulntracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vulntracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: vulntracker-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Missing KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Missing OIDC_CLIENT_SECRET in .env}
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/vulntracker-realm.json:/opt/keycloak/data/import/vulntracker-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", '{ printf "HEAD /health/ready HTTP/1.0\r\n\r\n" >&0; grep "HTTP/1.0 200"; } 0<>/dev/tcp/localhost/9000']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s

  api:
    build:
      context: .
      dockerfile: VulnTracker.Api/Dockerfile
    container_name: vulntracker-api
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__AutoMigrate: "true"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=vulntracker;Username=postgres;Password=${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD in .env}
      Authentication__Oidc__Authority: http://localhost:8081/realms/vulntracker
      Authentication__Oidc__MetadataAddress: http://keycloak:8080/realms/vulntracker/.well-known/openid-configuration
      Authentication__Oidc__ClientId: vulntracker-api
      Authentication__Oidc__ClientSecret: ${OIDC_CLIENT_SECRET:?Missing OIDC_CLIENT_SECRET in .env}
      Encryption__ActiveKeyId: k1
      Encryption__Keys__k1: ${ENCRYPTION_KEY_K1:?Missing ENCRYPTION_KEY_K1 in .env}

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: vulntracker-client
    depends_on:
      - api
    ports:
      - "5173:8080"

volumes:
  pgdata:
  keycloak_data: