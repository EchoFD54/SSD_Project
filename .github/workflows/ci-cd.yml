name: Secure CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

env:
  IMAGE_NAME: ghcr.io/echofd54/ssd_project/vuln-tracker/vulntracker.api

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore (Locked Mode), Build, and Test .NET
        working-directory: ./vuln-tracker
        run: |
          dotnet restore --locked-mode
          dotnet build --no-restore --configuration Release
          dotnet test --no-build --configuration Release --verbosity normal

      - name: Setup Node.js for React Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vuln-tracker/client/package-lock.json

      - name: Install and Build React Client
        working-directory: ./vuln-tracker/client
        run: |
          npm ci
          npm run build

  sast-codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp, javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  sca-trivy:
    name: SCA (Trivy File & Dependency Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in filesystem mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './vuln-tracker'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  dast-and-container-scan:
    name: Container Scan & DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [test, sast-codeql, sca-trivy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -f vuln-tracker/VulnTracker.Api/Dockerfile ./vuln-tracker

      - name: Generate CycloneDX SBOM for Container Image (Syft)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'cyclonedx-json'
          output-file: 'vulntracker-api-sbom.cdx.json'
          artifact-name: 'vulntracker-api-sbom.cdx.json'
          upload-artifact: true
          upload-release-assets: false

      - name: Scan Generated SBOM for Vulnerabilities (Grype)
        uses: anchore/scan-action@v7
        with:
          sbom: 'vulntracker-api-sbom.cdx.json'
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Start API Container for DAST
        run: |
          CI_TEST_KEY=$(openssl rand -base64 32)
          docker run -d --name vulntracker-api-test \
            -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e Encryption__ActiveKeyId=k1 \
            -e Encryption__Keys__k1="$CI_TEST_KEY" \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          for i in {1..15}; do
            if curl -sf http://localhost:8080/health | grep -q "Healthy"; then
              echo "API is up and running!"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 2
          done

          echo "API failed to start. Container logs:"
          docker logs vulntracker-api-test
          exit 1

      - name: Prepare workspace permissions for ZAP
        run: chmod -R a+rwX .

      - name: Run OWASP ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8080/openapi/v1.json'
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
          allow_issue_writing: false

  push-image:
    name: Push, Sign & Attest Image (GHCR + Cosign)
    runs-on: ubuntu-latest
    needs: [dast-and-container-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: ./vuln-tracker
          file: ./vuln-tracker/VulnTracker.Api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Generate SBOM for Published Digest
        uses: anchore/sbom-action@v0.24.3
        with:
          image: '${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}'
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: 'cyclonedx-json'
          output-file: 'published-sbom.cdx.json'
          upload-artifact: false
          upload-release-assets: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign Container Image Digest (Sigstore Keyless)
        run: |
          cosign sign --yes "${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}"

      - name: Attach Signed CycloneDX SBOM Attestation
        run: |
          cosign attest --yes \
            --type cyclonedx \
            --predicate published-sbom.cdx.json \
            "${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}"

      - name: Verify Image Signature Against GitHub OIDC Identity
        run: |
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci-cd.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}"